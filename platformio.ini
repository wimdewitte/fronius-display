; Fronius-Display – Elecrow CrowPanel, both ESP32-S3-WROOM-1-N4R8, 800 x 480
; 
;   crowpanel5  – 5.0" DIS07050H, board V3.0
;   crowpanel7  – 7.0" DIS08070H, board V3.0
; 
; The size you have is printed on the back of the PCB (SKU).
; In VS Code, choose the matching environment in the status bar at the bottom –
; the firmware for one display does not run on the other.
; 
; Basis: Arduino-ESP32 3.x (ESP-IDF 5) via pioarduino –
; the same stack as violet-display (github.com/AlPi-BRV/violet-display).
; The first build takes longer because the Arduino libraries are rebuilt with the
; settings under custom_sdkconfig.
; Important on Windows: project path WITHOUT spaces (e.g. C:\pio\fronius-display).

[platformio]
; Only ONE environment as default so "Upload" never flashes both in a row.
; For the 7": select "env:crowpanel7" in VS Code or run "pio run -e crowpanel7 -t upload".
default_envs = crowpanel5

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 4MB
; two application areas (each 1.9 MB) for updates over Wi-Fi;
; the settings (NVS) are stored in the same place as before and remain preserved
board_build.partitions = partitions.csv

; To reduce display flicker (see Espressif documentation "RGB Interfaced LCD"):
;  - run the program from PSRAM so flash writes during update / settings save do not stutter the display
;  - keep the display interrupt in internal RAM so the bounce buffer is always refilled
custom_sdkconfig =
    CONFIG_SPIRAM_XIP_FROM_PSRAM=y
    CONFIG_LCD_RGB_ISR_IRAM_SAFE=y
    CONFIG_LCD_RGB_RESTART_IN_VSYNC=y

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    https://github.com/lovyan03/LovyanGFX.git#1.2.31
    bblanchon/ArduinoJson@^7.0.4

; ---------------------------------------------------------------
[env:crowpanel5]
; 5.0" DIS07050H

[env:crowpanel7]
; 7.0" DIS08070H
build_flags =
    ${env.build_flags}
    -DBOARD_CROWPANEL7
    ; If the touch panel reacts rotated by 180°, enable the next line:
    ; -DTOUCH_ROTATE_180
